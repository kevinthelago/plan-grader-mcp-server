[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plan-grader-mcp"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["mcp"]

[project.scripts]
plan-grader-mcp = "plan_grader.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/plan_grader"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
